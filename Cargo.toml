[package]
name = "syncup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = "4.6.0"
ignore = "0.4.25"
kdam = "0.6.4"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
russh = "0.44"
russh-keys = "0.44"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.19.0"
rand = "0.8"
